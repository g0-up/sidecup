server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Asset có hash trong tên: cache 1 năm.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API và WebSocket: dùng khi chạy riêng nginx (compose "full"); production đi qua Caddy.
    location /api/ {
        # Mặc định nginx chỉ nhận body 1 MB; ảnh món tối đa 5 MB cộng phần đầu multipart.
        client_max_body_size 6m;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Không bao giờ mở API nội bộ cho notifier ra ngoài.
    location /internal/ {
        return 404;
    }

    # Cho bot đọc hết: không Disallow /t/ hay /o/, để bot thấy được X-Robots-Tag noindex ở các trang đó.
    # Production luôn chạy https sau Caddy/Traefik nên ghi cứng scheme.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://$host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://$host/</loc></url></urlset>\n';
    }

    # Trang theo mã bàn, mã đơn, trang người bán: không lập chỉ mục. add_header ở đây không kế thừa
    # từ "location /", nên lặp lại Cache-Control. Dùng rewrite ... break (không phải try_files) để phục vụ
    # index.html ngay trong location này; chuyển hướng nội bộ sang "location /" sẽ làm mất header.
    location ~ ^/(t/|o/|seller(/|$)|revoked$) {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /index.html break;
    }

    # SPA: index.html không cache để bản deploy mới có hiệu lực ngay.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
