# Overlay homelab: Traefik (mạng ngoài `homelab`, sau Cloudflare Tunnel) thay cho Caddy.
# Luôn ghép SAU file production:
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.homelab.yml --env-file infra/customers/<khách>/.env up -d --build
# hoặc `make homelab-up CUSTOMER=<khách>` (bỏ CUSTOMER = stack cũ đọc infra/.env).
# Xem docs/runbook.md mục "Triển khai homelab (Traefik)" và "Nhiều khách hàng".
#
# Hai hostname, lấy từ file env của stack:
#   https://${DOMAIN}      web (nginx tĩnh); link QR, link đơn trong tin Zalo
#   https://${API_DOMAIN}  api (REST /api/*, WebSocket /ws/*), /internal/* bị chặn
# Tên router/middleware Traefik có tiền tố sidecup-${CUSTOMER:-prod} để nhiều stack khách hàng chạy cùng một Traefik.
# Hai hostname cùng site nên cookie phiên SameSite=Lax vẫn đi kèm request từ web sang api (CORS có credentials).
# Không service nào publish cổng ra máy host, kể cả postgres.

services:
  # TLS kết thúc ở Cloudflare, Traefik lo định tuyến: không chạy Caddy.
  # Lưu ý: file production vẫn bắt buộc DOMAIN và ACME_EMAIL khi đọc cấu hình, xem infra/.env.example.
  caddy:
    profiles: ["caddy"]

  postgres:
    # Database chỉ nằm trong mạng default riêng của stack: không bao giờ map cổng ra host.
    ports: !reset []
    networks:
      default:
        # Mạng `homelab` dùng chung đã có nhiều service tên `api`, `web` của stack khác;
        # alias riêng để api không bao giờ phân giải nhầm sang Postgres của stack khác. Alias chỉ nằm trong
        # mạng default của project nên các stack khách hàng dùng chung tên này mà không đụng nhau.
        aliases: [sidecup-postgres]

  api:
    ports: !reset []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sidecup}:${POSTGRES_PASSWORD}@sidecup-postgres:5432/${POSTGRES_DB:-sidecup}?sslmode=disable
      # Gốc của web: link QR, link đơn, cờ Secure của cookie và Origin hợp lệ khi nâng cấp WebSocket.
      PUBLIC_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
    networks:
      - default
      - homelab
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab
      # API nội bộ cho notifier không bao giờ ra Internet: không router nào khớp → Traefik trả 404.
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-api.rule=Host(`${API_DOMAIN:?đặt API_DOMAIN trong file env}`) && !PathPrefix(`/internal`)
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-api.entrypoints=web
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-api.service=sidecup-${CUSTOMER:-prod}-api
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-api.middlewares=sidecup-${CUSTOMER:-prod}-headers
      - traefik.http.services.sidecup-${CUSTOMER:-prod}-api.loadbalancer.server.port=8080
      - traefik.http.services.sidecup-${CUSTOMER:-prod}-api.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.sidecup-${CUSTOMER:-prod}-api.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.sidecup-${CUSTOMER:-prod}-api.loadbalancer.healthcheck.timeout=2s

  web:
    ports: !reset []
    build:
      args:
        VITE_API_ORIGIN: https://${API_DOMAIN}
    networks:
      - homelab
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab
      # nginx.conf vẫn có location proxy /api, /ws tới `api:8080`; trên mạng `homelab` tên đó trỏ cả
      # sang stack khác, nên chặn hai path này ở Traefik (404) thay vì để nginx proxy nhầm.
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-web.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api/`) && !PathPrefix(`/ws/`)
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-web.entrypoints=web
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-web.service=sidecup-${CUSTOMER:-prod}-web
      - traefik.http.routers.sidecup-${CUSTOMER:-prod}-web.middlewares=sidecup-${CUSTOMER:-prod}-headers
      - traefik.http.services.sidecup-${CUSTOMER:-prod}-web.loadbalancer.server.port=80
      # Cùng bộ header với infra/caddy/Caddyfile, connect-src mở cho hostname api.
      # Traefik chỉ thấy http (TLS ở Cloudflare) nên phải ép HSTS.
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.frameDeny=true
      - "traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://${API_DOMAIN} wss://${API_DOMAIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - traefik.http.middlewares.sidecup-${CUSTOMER:-prod}-headers.headers.customResponseHeaders.Server=

networks:
  homelab:
    external: true
