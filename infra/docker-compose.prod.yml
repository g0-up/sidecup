name: sidecup-prod

# Một VPS: Caddy (TLS tự động) → web (nginx tĩnh) và api; Postgres không mở cổng ra ngoài.
# Biến môi trường đọc từ infra/.env (xem infra/.env.example và docs/runbook.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidecup}
      POSTGRES_USER: ${POSTGRES_USER:-sidecup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
    restart: always
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-sidecup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidecup}?sslmode=disable
      APP_TZ: ${APP_TZ:-Asia/Ho_Chi_Minh}
      PUBLIC_BASE_URL: https://${DOMAIN:?đặt DOMAIN trong infra/.env}
      SELLER_PASSWORD_HASH: ${SELLER_PASSWORD_HASH:?đặt SELLER_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?đặt SESSION_SECRET}
      NOTIFIER_TOKEN: ${NOTIFIER_TOKEN:?đặt NOTIFIER_TOKEN}
      ZALO_CREDENTIAL_KEY: ${ZALO_CREDENTIAL_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_FOLDER: ${R2_FOLDER:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATE_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    # Không publish cổng: chỉ Caddy và notifier (cùng mạng docker) gọi được api:8080.

  web:
    build:
      context: ../apps/web
      args:
        VITE_SELLER_NAME: ${SELLER_NAME:-}
        VITE_PUBLIC_ORIGIN: https://${DOMAIN}
    restart: always
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?đặt ACME_EMAIL trong infra/.env (Caddy cần để xin chứng chỉ)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # Dịch vụ notifier Zalo nằm ngoài repo này: thêm service ở đây, gọi http://api:8080/internal/* với NOTIFIER_TOKEN.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
